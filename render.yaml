databases:
  - name: expense-tracker-db
    databaseName: expensetracker
    user: expensetracker_user
    plan: free

services:
  - type: web
    name: expense-tracker-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn expense_project.wsgi:application"
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
